<meta charset="utf-8">

<title>CYVORA</title>
<style>
:root{--bg:#060914;--card:#0d1330;--card2:#151d47;--text:#e8eeff;--mut:#9aa8d8;--acc:#00f5d4;--acc2:#7c5cff;--pink:#ff4fd8;--bad:#ff4d6d;--warn:#ffd166;--bd:#27316b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--text);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7;padding-bottom:84px;background:radial-gradient(900px 520px at 90% -10%,rgba(124,92,255,.38),transparent 60%),radial-gradient(700px 460px at -10% 25%,rgba(0,245,212,.17),transparent 60%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/34px 34px,var(--bg);background-attachment:fixed}
header{position:sticky;top:0;z-index:5;background:rgba(6,9,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
header h1{font-size:20px;margin:0;display:flex;align-items:center;gap:8px}
.lg1{color:var(--acc);filter:drop-shadow(0 0 8px var(--acc))}
.logo{font-family:ui-monospace,Consolas,monospace;letter-spacing:5px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(0,245,212,.45))}
.lang{background:var(--card2);color:var(--text);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h2{color:var(--acc);margin:18px 0 12px}
h2::before{content:"// ";color:var(--pink);font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:isolate}
.hero{background:linear-gradient(135deg,rgba(124,92,255,.6),rgba(0,245,212,.32)),var(--card);border:1px solid rgba(0,245,212,.45);box-shadow:0 0 34px rgba(124,92,255,.3);border-radius:18px;padding:22px;margin-bottom:16px}
.hero h2{margin:0 0 6px;font-size:22px;color:#fff}.hero h2::before{content:""}.hero p{margin:0;color:#dbe6ff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--c,var(--bd));border-radius:16px;padding:16px;text-align:start;color:var(--text);cursor:pointer;font:inherit;box-shadow:0 0 14px rgba(0,0,0,.4)}
.tile:active{box-shadow:0 0 20px var(--c,var(--acc))}
.tile .ic{font-size:28px;display:block;filter:drop-shadow(0 0 8px var(--c,var(--acc)))}.tile b{display:block;margin-top:4px;color:var(--c,var(--text))}.tile small{color:var(--mut)}
.card{background:linear-gradient(160deg,var(--card),#0a1028);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px}
.tip{border-inline-start:4px solid var(--pink)}
details.card summary{cursor:pointer;font-weight:700;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card[open]{border-color:var(--acc);box-shadow:0 0 18px rgba(0,245,212,.18)}
details.card ul{margin:8px 0 0;padding-inline-start:20px;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card2);color:var(--text);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#03141a;border-color:transparent;font-weight:700}
ol.steps{padding-inline-start:22px;margin:0}ol.steps li{margin-bottom:8px}
.btn{background:linear-gradient(90deg,var(--acc),#4aa8ff);color:#03141a;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 0 16px rgba(0,245,212,.35)}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--bd);box-shadow:none}
.opt{display:block;width:100%;text-align:start;background:var(--card2);color:var(--text);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt:disabled{color:var(--text)}
.opt.ok{border-color:var(--acc);background:rgba(0,245,212,.16);box-shadow:0 0 14px rgba(0,245,212,.25)}.opt.no{border-color:var(--bad);background:rgba(255,77,109,.16)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--pink))}
.exp{background:var(--card2);border-radius:12px;padding:10px 12px;margin:10px 0;color:var(--mut)}
.sms{background:#0a1230;border:1px dashed var(--acc2);border-radius:14px;padding:14px;margin-bottom:12px;direction:ltr;text-align:left;word-break:break-word}
.row{display:flex;gap:10px}.row>*{flex:1}
.score{font-size:42px;text-align:center;margin:6px 0;color:var(--acc);text-shadow:0 0 18px rgba(0,245,212,.5)}
#msgs{display:flex;flex-direction:column;gap:8px;min-height:240px;margin-bottom:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.msg.bot{background:var(--card);border:1px solid var(--bd);align-self:flex-start}
.msg.me{background:linear-gradient(90deg,var(--acc2),#4aa8ff);color:#fff;align-self:flex-end}
.in{display:flex;gap:8px;position:sticky;bottom:78px}
.in input{flex:1;background:var(--card2);color:var(--text);border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;min-width:0}
nav{position:fixed;bottom:0;inset-inline:0;background:rgba(8,12,30,.96);border-top:1px solid var(--bd);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 2px;font:inherit;font-size:12px;cursor:pointer}
nav button span{display:block;font-size:22px}nav button.on{color:var(--acc);text-shadow:0 0 10px var(--acc)}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:20px}
.splash{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 40%,#1c2a70 0%,#05070f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s}
.splash.hide{opacity:0;pointer-events:none}
.splash b{font-size:54px;letter-spacing:10px;color:#00f5d4;text-shadow:0 0 24px #00f5d4,0 0 48px #7c5cff;animation:pop 1.2s ease both}
.splash i{font-style:normal;color:#dbe6ff;font-size:15px;animation:pop 1.2s .5s ease both}
.splash small{color:#8f9bc7;font-size:13px;animation:pop 1.2s .9s ease both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.sig{margin-top:18px;text-align:center;border:1px solid rgba(0,245,212,.35);border-radius:16px;padding:14px;background:rgba(124,92,255,.12)}
.sig span{display:block;color:var(--mut);font-size:12px}.sig strong{display:block;color:#00f5d4;font-size:17px;margin:4px 0}.sig em{font-style:normal;color:#dbe6ff;font-size:13px}
</style>
</head>

{id:'acc',i:'👤',t:{ar:'حسابي مخترق',en:'Account hacked'},steps:{
ar:['ادخل من جهاز آمن وغيّر كلمة المرور فوراً.','إن لم تستطع الدخول فاستخدم خيار استعادة الحساب لدى الخدمة.','سجّل الخروج من جميع الجلسات والأجهزة.','فعّل المصادقة الثنائية.','غيّر كلمة المرور في أي حساب آخر استخدم الكلمة نفسها.','راجع البريد المرتبط وقواعد التحويل وأي تطبيقات مرتبطة بالحساب.','أبلغ أصدقاءك أن الرسائل الغريبة منك ليست حقيقية، وبلّغ الخدمة.'],
en:['From a safe device, change the password right away.','If locked out, use the service’s account recovery.','Sign out of all sessions and devices.','Turn on two-factor authentication.','Change the password anywhere else you reused it.','Check the linked email, forwarding rules and connected apps.','Warn your contacts about strange messages and report to the service.']}},
{id:'file',i:'📎',t:{ar:'وصلني ملف مشبوه',en:'Suspicious file'},steps:{
ar:['لا تفتحه ولا تشغّله.','تحقق من اسمه: الامتداد المزدوج مثل ‎invoice.pdf.exe‎ علامة خطر.','اسأل المرسل عبر قناة أخرى هل أرسله فعلاً.','ارفعه إلى خدمة فحص مثل VirusTotal لمعرفة رأي عدة محركات.','احذفه نهائياً إذا كان مشكوكاً فيه.','إن فتحته بالخطأ فافصل الجهاز عن الإنترنت وشغّل فحصاً كاملاً.'],
en:['Do not open or run it.','Check the name: a double extension like invoice.pdf.exe is a red flag.','Ask the sender through another channel whether they really sent it.','Upload it to a scanning service such as VirusTotal to see multiple engines’ verdicts.','Delete it permanently if in doubt.','If you opened it by mistake, disconnect from the internet and run a full scan.']}},
{id:'link',i:'🔗',t:{ar:'ضغطت على رابط مشبوه',en:'Clicked a bad link'},steps:{
ar:['أغلق الصفحة فوراً ولا تُدخل أي بيانات.','إن أدخلت كلمة مرور فغيّرها حالاً من الموقع الرسمي.','إن أدخلت بيانات بطاقة فاتصل بالبنك لإيقافها.','امسح ذاكرة المتصفح وراجع التنزيلات.','شغّل فحصاً للجهاز.'],
en:['Close the page immediately and enter nothing.','If you typed a password, change it now on the official site.','If you entered card details, call your bank to block the card.','Clear browser data and check downloads.','Run a device scan.']}},
{id:'phone',i:'📱',t:{ar:'هاتفي يبدو مصاباً',en:'Phone seems infected'},steps:{
ar:['علامات: بطارية تنفد بسرعة، إعلانات مفاجئة، تطبيقات لا تعرفها.','فعّل وضع الطيران لقطع الاتصال.','أعد التشغيل في الوضع الآمن واحذف التطبيقات المريبة.','راجع التطبيقات ذات صلاحيات الإدارة والوصول.','غيّر كلمات المرور من جهاز آخر.','إن استمرت المشكلة فاعمل إعادة ضبط المصنع بعد نسخ احتياطي للصور والملفات فقط.'],
en:['Signs: fast battery drain, sudden ads, apps you do not know.','Turn on airplane mode to cut the connection.','Reboot in Safe Mode and remove suspicious apps.','Review apps with admin or accessibility access.','Change passwords from another device.','If it persists, factory reset after backing up only photos and files.']}},
{id:'ransom',i:'🔒',t:{ar:'ملفاتي مشفّرة (فدية)',en:'Ransomware'},steps:{
ar:['افصل الجهاز عن الإنترنت والشبكة فوراً.','لا تدفع الفدية.','لا تعيد تشغيل الجهاز إن أمكن، وصوّر رسالة الفدية.','أبلغ جهة العمل أو المدرسة أو الجهات المختصة.','ابحث عن أدوات فك التشفير المجانية الرسمية (مثل مشروع No More Ransom).','استعد ملفاتك من نسخة احتياطية بعد تنظيف الجهاز.'],
en:['Disconnect the device from the internet and network immediately.','Do not pay the ransom.','Avoid rebooting if possible and photograph the ransom note.','Report to your workplace, school or the authorities.','Look for official free decryptors (such as the No More Ransom project).','Restore from backup after cleaning the device.']}}

{"k":["cpu", "processor", "معالج مركزي", "معالج الحاسوب", "معالج الجهاز", "وحده المعالجه المركزيه"],"ar":"المعالج المركزي (CPU) هو عقل الحاسوب: ينفذ التعليمات الحسابية والمنطقية.\nيُقاس أداؤه بعدد الأنوية (Cores) والخيوط (Threads) والسرعة بالغيغاهرتز (GHz) والذاكرة المخبئية (Cache).\nأشهر الشركات: Intel وAMD، وفي الهواتف Qualcomm وApple.","en":"The CPU is the computer's brain: it executes arithmetic and logic instructions.\nPerformance depends on cores, threads, clock speed (GHz) and cache.\nMajor makers: Intel and AMD, and Qualcomm and Apple in phones."},
{"k":["ram", "ذاكره عشوائيه", "ذاكره الوصول العشوائي", "رام"],"ar":"الذاكرة العشوائية (RAM) ذاكرة سريعة ومؤقتة تحمل البرامج والبيانات المفتوحة حالياً، وتُمسح عند إطفاء الجهاز.\nحجمها (8 أو 16 أو 32 GB) يؤثر في قدرتك على فتح برامج كثيرة معاً. وهي تختلف عن التخزين (SSD أو HDD) الذي يحفظ الملفات بشكل دائم.","en":"RAM is fast, temporary memory holding the programs and data currently open. It clears when the device powers off.\nIts size (8, 16 or 32 GB) affects how many programs you can run together. It differs from storage (SSD or HDD), which keeps files permanently."},
{"k":["ssd", "hdd", "nvme", "قرص صلب", "قرص تخزين", "وحده تخزين"],"ar":"HDD قرص ميكانيكي مغناطيسي: أرخص وبسعة كبيرة لكنه أبطأ ويتأثر بالصدمات.\nSSD ذاكرة فلاش بلا أجزاء متحركة: أسرع بكثير وأهدأ وأخف، وأغلى لكل غيغابايت.\nوNVMe أسرع أنواع SSD. الأفضل لنظام التشغيل: SSD.","en":"HDD is a mechanical magnetic disk: cheaper with large capacity but slower and fragile.\nSSD is flash memory with no moving parts: much faster, quieter and lighter, but pricier per GB.\nNVMe is the fastest SSD type. For the operating system, an SSD is best."},
{"k":["gpu", "graphics card", "كرت الشاشه", "كرت الرسوميات", "بطاقه الرسوميات", "كرت شاشه", "وحده معالجه الرسوميات"],"ar":"وحدة معالجة الرسوميات (GPU) متخصصة في العمليات المتوازية: الألعاب والرسم ثلاثي الأبعاد وتحرير الفيديو، وأيضاً تدريب نماذج الذكاء الاصطناعي.\nالمدمجة داخل المعالج أضعف، والمنفصلة (مثل Nvidia وAMD) أقوى.","en":"A GPU specializes in parallel work: games, 3D graphics, video editing, and training AI models.\nIntegrated GPUs inside the CPU are weaker, dedicated ones (Nvidia, AMD) are stronger."},
{"k":["motherboard", "لوحه ام", "اللوحه الام", "مذربورد"],"ar":"اللوحة الأم (Motherboard) هي اللوحة الرئيسية التي تربط كل مكونات الحاسوب: المعالج والذاكرة والتخزين وكرت الشاشة، وتوفّر المنافذ لتوصيل الأجهزة.","en":"The motherboard is the main circuit board connecting all components: CPU, memory, storage, graphics card, and it provides ports for devices."},
{"k":["bios", "uefi", "secure boot"],"ar":"BIOS أو UEFI برنامج مدمج في اللوحة الأم يعمل عند التشغيل: يفحص العتاد (POST) ثم يحمّل نظام التشغيل. UEFI هو الأحدث والأسرع ويدعم الإقلاع الآمن (Secure Boot) الذي يمنع تحميل برامج إقلاع غير موثوقة.","en":"BIOS or UEFI is firmware on the motherboard that runs at power-on: it tests hardware (POST) and loads the operating system. UEFI is the modern, faster one and supports Secure Boot, which blocks untrusted bootloaders."},
{"k":["ما هو الحاسوب", "تعريف الحاسوب", "مكونات الحاسوب", "what is a computer", "computer components", "hardware and software"],"ar":"الحاسوب جهاز إلكتروني يستقبل البيانات (إدخال) ويعالجها ويخزنها ويعرض النتائج (إخراج).\nمكوناته: عتاد (Hardware) كالمعالج والذاكرة والشاشة، وبرمجيات (Software) كنظام التشغيل والتطبيقات.\nالإدخال: لوحة المفاتيح والفأرة. الإخراج: الشاشة والطابعة.","en":"A computer is an electronic device that takes input, processes and stores data, and produces output.\nIt has hardware (CPU, memory, screen) and software (operating system, apps).\nInput: keyboard, mouse. Output: screen, printer."},
{"k":["binary", "bit", "byte", "ثنائي", "نظام ثنائي", "بت وبايت", "kb mb gb", "وحدات التخزين"],"ar":"البت (Bit) أصغر وحدة معلومات: 0 أو 1. البايت (Byte) = 8 بت.\nثم: KB = 1024 بايت، MB = 1024 KB، GB = 1024 MB، TB = 1024 GB.\nالحاسوب يمثل كل شيء (نصوص وصور وصوت) بالنظام الثنائي.","en":"A bit is the smallest unit: 0 or 1. A byte = 8 bits.\nThen KB = 1024 bytes, MB = 1024 KB, GB = 1024 MB, TB = 1024 GB.\nComputers represent everything (text, images, sound) in binary."},
{"k":["process", "thread", "عمليه وخيط", "خيوط المعالجه", "تعدد المهام", "multitasking"],"ar":"العملية (Process) برنامج قيد التشغيل له ذاكرته الخاصة. الخيط (Thread) مسار تنفيذ داخل العملية يشارك ذاكرتها مع بقية خيوطها.\nنظام التشغيل يوزع وقت المعالج بين العمليات بسرعة كبيرة فيبدو أنها تعمل معاً.","en":"A process is a running program with its own memory. A thread is an execution path inside a process that shares its memory.\nThe OS rapidly shares CPU time between processes so they appear to run together."},
{"k":["compiler", "interpreter", "مترجم", "مفسر", "compiled", "interpreted"],"ar":"المترجم (Compiler) يحوّل الكود كله إلى لغة الآلة قبل التشغيل (مثل C وC++ وGo)، فيكون التنفيذ أسرع.\nالمفسّر (Interpreter) ينفّذ الكود سطراً بسطر (مثل Python)، وهو أسهل للتجريب وأبطأ غالباً.\nJava تُترجم إلى Bytecode يعمل على JVM.","en":"A compiler converts all code to machine language before running (C, C++, Go), so execution is faster.\nAn interpreter runs code line by line (Python), easier to experiment with but usually slower.\nJava compiles to bytecode that runs on the JVM."},
{"k":["python", "بايثون", "بايثن"],"ar":"Python لغة عالية المستوى سهلة القراءة، تُستخدم في الذكاء الاصطناعي وتحليل البيانات والأتمتة والأمن السيبراني وتطوير الويب (Django وFlask).\nملفاتها بامتداد .py، ومثالها: print(\"Hello\").\nهي الأنسب للمبتدئين.","en":"Python is an easy-to-read high-level language used in AI, data analysis, automation, cybersecurity and web development (Django, Flask).\nFiles end in .py, for example: print(\"Hello\").\nIt is the best choice for beginners."},
{"k":["javascript", "جافاسكربت", "جافا سكربت", "جافا سكريبت", "js", "node.js", "nodejs"],"ar":"JavaScript لغة الويب: تعمل داخل المتصفح لجعل الصفحات تفاعلية، وتعمل على الخادم عبر Node.js. وهي ليست Java رغم تشابه الاسم.\nملفاتها .js، وتستخدم مع مكتبات مثل React.","en":"JavaScript is the language of the web: it runs in the browser to make pages interactive, and on servers via Node.js. It is not Java despite the similar name.\nFiles end in .js, and it is used with libraries like React."},
{"k":["java", "جافا"],"ar":"Java لغة كائنية التوجه مستقلة عن المنصة (اكتب مرة وشغّل في أي مكان) لأنها تعمل على آلة JVM.\nتُستخدم في أنظمة الشركات والخوادم وتطبيقات أندرويد (مع Kotlin).","en":"Java is an object-oriented, platform-independent language (write once, run anywhere) because it runs on the JVM.\nIt is used in enterprise systems, servers and Android apps (alongside Kotlin)."},
{"k":["c++", "cpp", "c plus plus", "سي بلس", "سي++", "لغه c++", "لغه سي بلس"],"ar":"C++ لغة قوية وسريعة قريبة من العتاد، تُستخدم في الألعاب ومحركات الرسوم وأنظمة التشغيل والبرمجيات عالية الأداء.\nتتطلب إدارة الذاكرة يدوياً، وأخطاء الذاكرة فيها سبب لكثير من الثغرات الأمنية.","en":"C++ is a powerful, fast, hardware-near language used in games, graphics engines, operating systems and high-performance software.\nIt needs manual memory management, and memory errors cause many security vulnerabilities."},
{"k":["c language", "c programming", "لغه c", "لغه سي", "لغه الس"],"ar":"لغة C من أقدم لغات البرمجة وأكثرها تأثيراً، بُنيت بها أنظمة مثل لينكس. قريبة من العتاد وسريعة، وتُدرَّس لفهم الذاكرة والمؤشرات (Pointers) وكيف يعمل الحاسوب فعلاً.","en":"C is one of the oldest and most influential languages, used to build systems like Linux. It is fast and close to hardware, and taught to understand memory, pointers and how computers really work."},
{"k":["c#", "csharp", "c sharp", "سي شارب"],"ar":"C# لغة من مايكروسوفت تعمل على منصة .NET. تُستخدم في تطوير ألعاب Unity وتطبيقات ويندوز وخدمات الويب.","en":"C# is a Microsoft language running on the .NET platform. It is used for Unity games, Windows apps and web services."},
{"k":["php", "بي اتش بي"],"ar":"PHP لغة تعمل على الخادم لتطوير مواقع الويب، وهي الأساس الذي بُني عليه WordPress وكثير من المواقع.","en":"PHP is a server-side language for building websites, the foundation of WordPress and many sites."},
{"k":["html", "اتش تي ام ال", "وسوم html"],"ar":"HTML لغة ترميز تبني هيكل صفحة الويب: العناوين والفقرات والروابط والصور، عبر وسوم مثل <h1> و<p> و<a>. وهي ليست لغة برمجة بالمعنى الكامل لأنها لا تحتوي منطقاً أو شروطاً.","en":"HTML is a markup language that builds the structure of a web page: headings, paragraphs, links, images, using tags like <h1>, <p> and <a>. It is not a full programming language since it has no logic or conditions."},
{"k":["css", "تنسيق الصفحات", "ورقه الانماط"],"ar":"CSS لغة التنسيق في الويب: الألوان والخطوط والمسافات وتخطيط الصفحة وجعلها مناسبة لشاشة الهاتف (Responsive). تعمل مع HTML لتحديد الشكل بينما HTML يحدد المحتوى.","en":"CSS styles the web: colors, fonts, spacing, page layout and making it fit phone screens (responsive). HTML defines the content while CSS defines the look."},
{"k":["kotlin", "swift", "كوتلن", "سويفت", "ios development", "تطوير تطبيقات الجوال", "تطبيقات اندرويد وايفون", "mobile app development"],"ar":"لتطبيقات الجوال: Kotlin هي اللغة الرسمية لأندرويد (من Google)، وSwift للغة آبل لتطبيقات iPhone وMac.\nوهناك حلول تعمل على النظامين بكود واحد مثل Flutter (لغة Dart) وReact Native (JavaScript).","en":"For mobile apps: Kotlin is the official Android language (Google) and Swift is Apple's for iPhone and Mac.\nCross-platform options with one codebase include Flutter (Dart) and React Native (JavaScript)."},
{"k":["rust", "golang", "go language", "لغه go", "راست", "لغه rust"],"ar":"Rust لغة تركّز على أمان الذاكرة والأداء العالي دون جامع نفايات.\nGo (Golang) من Google: بسيطة وسريعة وممتازة للخوادم والخدمات السحابية.","en":"Rust focuses on memory safety and high performance without a garbage collector.\nGo (Golang) from Google is simple, fast and great for servers and cloud services."},
{"k":["what is a programming language", "ما هي لغه البرمجه", "ماهي لغه البرمجه", "تعريف لغه البرمجه", "معنى لغه البرمجه"],"ar":"لغة البرمجة وسيلة لكتابة التعليمات التي ينفذها الحاسوب بصيغة يفهمها الإنسان، ثم تُترجم إلى لغة الآلة. لكل لغة قواعدها (Syntax) ومجالها. تتشابه المفاهيم الأساسية بينها: المتغيرات والشروط والحلقات والدوال.","en":"A programming language is a way to write instructions for a computer in a human-readable form, later translated to machine language. Each has its own syntax and domain, but core concepts are shared: variables, conditions, loops, functions."},
{"k":["git", "github", "gitlab", "version control", "التحكم بالاصدارات", "مستودع"],"ar":"Git نظام يتتبع تغييرات الكود ويحفظ تاريخ المشروع، وGitHub منصة لاستضافة المستودعات والتعاون عليها.\nأوامر أساسية: git init لإنشاء مستودع، git add لإضافة الملفات، git commit لحفظ نسخة، git push للرفع، git pull للتحديث، git clone للنسخ.","en":"Git tracks code changes and keeps project history, and GitHub hosts repositories and enables collaboration.\nBasic commands: git init, git add, git commit, git push, git pull, git clone."},
{"k":["algorithm", "خوارزميه", "خوارزميات", "البحث الثنائي", "binary search", "sorting", "الفرز"],"ar":"الخوارزمية خطوات منظمة ومحددة لحل مشكلة. أمثلة: البحث الثنائي (يقسم القائمة المرتبة نصفين في كل خطوة)، وخوارزميات الفرز (Bubble Sort وQuick Sort وMerge Sort).\nتُقاس كفاءتها بزمن التنفيذ والذاكرة (ترميز Big O).","en":"An algorithm is a clear sequence of steps to solve a problem. Examples: binary search (halves a sorted list each step) and sorting algorithms (Bubble, Quick, Merge sort).\nEfficiency is measured by time and memory (Big O notation)."},
{"k":["big o", "تعقيد الخوارزميه", "time complexity"],"ar":"ترميز Big O يصف كيف يزداد زمن التنفيذ مع حجم الإدخال n: O(1) ثابت، O(log n) لوغاريتمي (البحث الثنائي)، O(n) خطي، O(n log n) للفرز الفعّال، O(n²) تربيعي (حلقتان متداخلتان).","en":"Big O describes how running time grows with input size n: O(1) constant, O(log n) logarithmic (binary search), O(n) linear, O(n log n) for efficient sorting, O(n^2) quadratic (nested loops)."},
{"k":["data structure", "هياكل البيانات", "بنيه بيانات", "stack", "queue", "linked list", "hash table", "المكدس", "الطابور", "مصفوفه", "array"],"ar":"أهم هياكل البيانات:\n• المصفوفة (Array): عناصر متجاورة بفهرس.\n• القائمة المرتبطة: عقد تشير كل واحدة للتالية.\n• المكدس (Stack): آخر داخل أول خارج.\n• الطابور (Queue): أول داخل أول خارج.\n• جدول التجزئة (Hash Table): بحث سريع بمفتاح.\n• الشجرة والرسم البياني: للعلاقات الهرمية والشبكية.","en":"Key data structures:\n• Array: indexed contiguous items.\n• Linked list: nodes each pointing to the next.\n• Stack: last in, first out.\n• Queue: first in, first out.\n• Hash table: fast lookup by key.\n• Tree and graph: hierarchical and network relations."},
{"k":["oop", "object oriented", "البرمجه كائنيه", "كائنيه التوجه", "class", "object", "صنف", "وراثه", "inheritance"],"ar":"البرمجة كائنية التوجه (OOP) تنظّم الكود في أصناف (Classes) تُنشأ منها كائنات (Objects).\nأركانها: التغليف (إخفاء التفاصيل)، الوراثة (صنف يرث من صنف)، تعدد الأشكال، والتجريد.","en":"Object-oriented programming organizes code into classes from which objects are created.\nIts pillars: encapsulation, inheritance, polymorphism and abstraction."},
{"k":["variable", "متغير", "متغيرات", "loop", "حلقه", "حلقات", "for loop", "while", "if else", "شرط", "conditions", "function", "دال", "دوال", "دالة"],"ar":"أساسيات أي لغة برمجة:\n• المتغير: اسم يخزن قيمة (age = 18).\n• الشرط: if ... else لاتخاذ قرار.\n• الحلقة: for أو while لتكرار عمل.\n• الدالة: كتلة كود لها اسم تُستدعى عند الحاجة وتقلل التكرار.\n• القائمة: تخزّن عدة قيم.\nتعلّمي هذه الخمسة وستفهمين أي لغة بسهولة.","en":"Fundamentals of any language:\n• Variable: a name storing a value (age = 18).\n• Condition: if ... else to make decisions.\n• Loop: for or while to repeat work.\n• Function: a named block of code reused when needed.\n• List: stores multiple values.\nLearn these five and any language becomes easier."},
{"k":["api", "json", "rest api", "واجهه برمجه التطبيقات"],"ar":"API واجهة تتيح لبرنامج التواصل مع برنامج أو خدمة أخرى، مثل طلب حالة الطقس من خدمة خارجية. غالباً عبر HTTP وتُرجع البيانات بصيغة JSON (نص منظم بأزواج مفتاح وقيمة). REST أسلوب شائع لتصميمها.","en":"An API lets one program talk to another program or service, for example requesting weather from an external service. Usually over HTTP and returns data as JSON (structured key-value text). REST is a common design style."},
{"k":["framework", "library", "مكتبه برمجيه", "اطار عمل", "react", "django", "flask", "laravel", "angular", "vue"],"ar":"المكتبة (Library) كود جاهز تستدعيه أنت عند الحاجة. الإطار (Framework) هيكل جاهز يستدعي هو كودك.\nأمثلة: React وVue وAngular للواجهات، وDjango وFlask وLaravel وSpring للخوادم.","en":"A library is ready code you call when needed. A framework is a ready structure that calls your code.\nExamples: React, Vue, Angular for front ends; Django, Flask, Laravel, Spring for back ends."},
{"k":["debug", "bug", "تصحيح الاخطاء", "خطا برمجي", "حل الاخطاء", "error message", "رسالة خطا"],"ar":"لتصحيح الأخطاء (Debugging):\n1) اقرئي رسالة الخطأ كاملة وانتبهي لرقم السطر.\n2) أعيدي إنتاج المشكلة بخطوات ثابتة.\n3) اطبعي قيم المتغيرات (print أو console.log) أو استخدمي المنقّح (Debugger).\n4) بسّطي الكود حتى تعزلي سبب الخطأ.\n5) ابحثي عن نص الرسالة في الإنترنت.\nالأنواع: نحوي (Syntax)، وقت التشغيل (Runtime)، ومنطقي (Logic).","en":"To debug:\n1) Read the full error message and note the line number.\n2) Reproduce the problem with fixed steps.\n3) Print variable values (print or console.log) or use a debugger.\n4) Simplify the code to isolate the cause.\n5) Search the exact message online.\nTypes: syntax, runtime and logic errors."},
{"k":["open source", "مفتوح المصدر", "مفتوحه المصدر", "license", "mit license", "gpl"],"ar":"البرمجيات مفتوحة المصدر يكون كودها متاحاً للجميع لقراءته وتعديله وفق ترخيص (مثل MIT وGPL). أمثلة: Linux وFirefox وPython وVS Code.","en":"Open-source software has public code anyone can read and modify under a license (MIT, GPL). Examples: Linux, Firefox, Python, VS Code."},
{"k":["cloud", "cloud computing", "سحابه", "حوسبه سحابيه", "aws", "azure", "google cloud", "saas", "iaas", "paas"],"ar":"الحوسبة السحابية استئجار موارد (خوادم وتخزين وقواعد بيانات) عبر الإنترنت ودفع الثمن حسب الاستخدام.\nنماذجها: IaaS (بنية تحتية)، PaaS (منصة)، SaaS (برنامج جاهز كالبريد). أشهر المزودين: AWS وAzure وGoogle Cloud.","en":"Cloud computing means renting resources (servers, storage, databases) over the internet and paying for usage.\nModels: IaaS (infrastructure), PaaS (platform), SaaS (ready software like email). Major providers: AWS, Azure, Google Cloud."},
{"k":["docker", "container", "حاويه", "حاويات", "kubernetes"],"ar":"Docker يحزم التطبيق مع كل اعتمادياته في حاوية (Container) معزولة تعمل بالطريقة نفسها في أي جهاز، وهي أخف من الآلات الافتراضية. وKubernetes يدير عدداً كبيراً من الحاويات.","en":"Docker packages an app with all its dependencies in an isolated container that runs the same everywhere, lighter than virtual machines. Kubernetes manages many containers."},
{"k":["virtual machine", "virtualbox", "vmware", "الاله الافتراضيه", "اله افتراضيه"],"ar":"الآلة الافتراضية (VM) حاسوب افتراضي يعمل داخل حاسوبك عبر برنامج مثل VirtualBox أو VMware. تفيد لتجربة أنظمة تشغيل أخرى وتعلّم الأمن السيبراني في بيئة معزولة دون خطر على جهازك الأساسي.","en":"A virtual machine is a virtual computer running inside your computer via software like VirtualBox or VMware. It is useful for trying other operating systems and practicing cybersecurity in an isolated environment without risking your main machine."},
{"k":["http", "browser", "متصفح", "how the web works", "كيف يعمل الانترنت", "كيف يعمل الموقع", "web server", "خادم ويب"],"ar":"كيف يصل الموقع إليك:\n1) تكتبين العنوان في المتصفح.\n2) خدمة DNS تحوله إلى عنوان IP.\n3) المتصفح يرسل طلب HTTP أو HTTPS إلى الخادم.\n4) الخادم يرد بملفات HTML وCSS وJavaScript.\n5) المتصفح يعرضها كصفحة.","en":"How a site reaches you:\n1) You type the address in the browser.\n2) DNS converts it to an IP address.\n3) The browser sends an HTTP or HTTPS request to the server.\n4) The server replies with HTML, CSS and JavaScript.\n5) The browser renders it as a page."},
{"k":["domain", "hosting", "استضافه", "نطاق", "اسم النطاق", "دومين", "استضافه مواقع"],"ar":"النطاق (Domain) هو اسم الموقع مثل example.com. الاستضافة (Hosting) هي الخادم الذي تُخزَّن عليه ملفات الموقع. للمواقع الثابتة تتوفر استضافة مجانية مثل GitHub Pages وNetlify.","en":"A domain is the site's name such as example.com. Hosting is the server storing the site's files. Static sites can be hosted free on GitHub Pages or Netlify."},
{"k":["front end", "back end", "frontend", "backend", "full stack", "fullstack", "واجهه امامية", "واجهه خلفيه"],"ar":"الواجهة الأمامية (Front-end) ما يراه المستخدم ويتفاعل معه (HTML وCSS وJavaScript). الواجهة الخلفية (Back-end) الخادم وقاعدة البيانات والمنطق (Python أو Node.js أو Java). ومطوّر Full-stack يعمل على الاثنين.","en":"Front-end is what users see and interact with (HTML, CSS, JavaScript). Back-end is the server, database and logic (Python, Node.js, Java). A full-stack developer works on both."},
{"k":["web development roadmap", "تطوير الويب", "مسار تطوير الويب", "how to become web developer", "اصبح مطور ويب"],"ar":"مسار تعلّم تطوير الويب:\n1) HTML ثم CSS.\n2) JavaScript.\n3) Git وGitHub.\n4) مكتبة أو إطار مثل React.\n5) الخادم: Node.js أو Python.\n6) قواعد البيانات (SQL).\n7) النشر على استضافة. وابني مشروعاً صغيراً في كل مرحلة.","en":"A web development roadmap:\n1) HTML then CSS.\n2) JavaScript.\n3) Git and GitHub.\n4) A library or framework like React.\n5) Server side: Node.js or Python.\n6) Databases (SQL).\n7) Deploy to hosting. Build a small project at each stage."},
{"k":["internet vs web", "الفرق بين الانترنت والويب", "الانترنت والويب", "what is the internet", "ما هو الانترنت"],"ar":"الإنترنت هو الشبكة العالمية التي تربط ملايين الشبكات (البنية التحتية). الويب (WWW) خدمة تعمل فوقه وهي صفحات المواقع عبر HTTP. وهناك خدمات أخرى على الإنترنت مثل البريد الإلكتروني ونقل الملفات.","en":"The internet is the global network connecting millions of networks (the infrastructure). The web (WWW) is one service on top of it: websites over HTTP. Other services use the internet too, like email and file transfer."},
{"k":["machine learning", "تعلم الاله", "تعلم الي", "ml", "تعلم الالي"],"ar":"التعلم الآلي (Machine Learning) فرع من الذكاء الاصطناعي تتعلم فيه الخوارزميات الأنماط من البيانات بدل قواعد مكتوبة يدوياً.\nأنواعه: بإشراف (بيانات مصنّفة)، بدون إشراف (اكتشاف الأنماط)، والتعزيزي (تعلم بالمكافأة). أمثلة: ترشيح الأفلام وكشف الاحتيال وتصنيف الرسائل المزعجة.","en":"Machine learning is a branch of AI where algorithms learn patterns from data instead of hand-written rules.\nTypes: supervised (labeled data), unsupervised (finding patterns) and reinforcement (learning by reward). Examples: movie recommendations, fraud detection, spam filtering."},
{"k":["deep learning", "neural network", "تعلم عميق", "شبكه عصبيه", "شبكات عصبيه", "الشبكات العصبيه"],"ar":"الشبكات العصبية الاصطناعية مستوحاة من الدماغ: طبقات من العقد تعدّل أوزانها أثناء التدريب. والتعلم العميق (Deep Learning) يستخدم شبكات بطبقات كثيرة، وهو أساس التعرف على الصور والكلام والنماذج اللغوية الكبيرة.","en":"Artificial neural networks are loosely inspired by the brain: layers of nodes that adjust weights during training. Deep learning uses networks with many layers and powers image and speech recognition and large language models."},
{"k":["llm", "large language model", "نموذج لغوي", "نماذج لغويه", "generative ai", "ذكاء اصطناعي توليدي", "ذكاء توليدي", "chatgpt", "claude", "gemini", "gpt"],"ar":"النماذج اللغوية الكبيرة (LLM) تُدرَّب على كميات هائلة من النصوص لتتنبأ بالكلمة التالية، فتستطيع الكتابة والتلخيص والترجمة والبرمجة. أمثلة: Claude وGPT وGemini.\nمحدوديتها: قد «تهلوس» أي تختلق معلومات بثقة، لذلك يجب التحقق من المعلومات المهمة.","en":"Large language models (LLMs) are trained on huge amounts of text to predict the next word, which lets them write, summarize, translate and code. Examples: Claude, GPT, Gemini.\nLimitation: they can hallucinate, meaning state made-up facts confidently, so verify important information."},
{"k":["nlp", "natural language processing", "معالجه اللغه الطبيعيه", "معالجه اللغات"],"ar":"معالجة اللغة الطبيعية (NLP) فرع من الذكاء الاصطناعي يمكّن الحاسوب من فهم اللغة البشرية وتوليدها. أمثلة: الترجمة الآلية والمساعدات الصوتية وتحليل المشاعر وروبوتات المحادثة.","en":"Natural language processing (NLP) is the AI branch that lets computers understand and generate human language. Examples: machine translation, voice assistants, sentiment analysis, chatbots."},
{"k":["prompt", "prompt engineering", "هندسه الاوامر", "كتابه الاوامر للذكاء الاصطناعي", "هندسه التعليمات"],"ar":"لتكتبي أمراً (Prompt) جيداً للذكاء الاصطناعي:\n• حدّدي المطلوب والهدف بوضوح.\n• اذكري السياق والجمهور.\n• اطلبي صيغة الإخراج (قائمة، جدول، طول معين).\n• أعطي مثالاً إن أمكن.\n• عدّلي وكرّري بناءً على النتيجة.","en":"To write a good prompt for AI:\n• State the task and goal clearly.\n• Give context and audience.\n• Ask for an output format (list, table, length).\n• Add an example if possible.\n• Refine and iterate on the result."},
{"k":["data science", "علم البيانات", "تحليل البيانات", "pandas", "data analysis", "big data", "البيانات الضخمه"],"ar":"علم البيانات يجمع وينظّف ويحلّل ويعرض البيانات لاستخراج قرارات مفيدة. الأدوات الشائعة: Python مع Pandas وNumPy وMatplotlib، ولغة SQL، وأدوات العرض مثل Power BI.","en":"Data science collects, cleans, analyzes and presents data to support decisions. Common tools: Python with Pandas, NumPy and Matplotlib, SQL, and visualization tools like Power BI."},
{"k":["blockchain", "بلوكتشين", "بلوك تشين", "سلسله الكتل", "bitcoin", "بيتكوين", "عمله رقميه", "crypto currency", "cryptocurrency"],"ar":"البلوكتشين سجل موزع يُخزَّن فيه البيانات في كتل مترابطة بالتجزئة (Hash) ويصعب تعديلها بعد إضافتها، وتتفق عليها شبكة من الأجهزة بدل جهة مركزية. هو أساس عملة Bitcoin. تنبيه: العملات الرقمية متقلبة وتنتشر فيها عمليات الاحتيال.","en":"A blockchain is a distributed ledger storing data in blocks linked by hashes, hard to alter once added and agreed on by a network instead of a central party. It underlies Bitcoin. Note: cryptocurrencies are volatile and scams are common."},
{"k":["quantum", "حوسبه كموميه", "كمبيوتر كمومي", "qubit"],"ar":"الحوسبة الكمومية تستخدم الكيوبت (Qubit) الذي قد يكون 0 و1 معاً (التراكب)، فتحل بعض المسائل أسرع كثيراً. ما زالت في مراحلها المبكرة، وقد تهدد مستقبلاً بعض أنواع التشفير الحالية (مثل RSA) مما يدفع لتطوير تشفير مقاوم للحواسيب الكمومية.","en":"Quantum computing uses qubits that can be 0 and 1 at once (superposition), solving some problems much faster. It is still early, and may someday threaten some current encryption (like RSA), driving development of quantum-resistant cryptography."},
{"k":["vs code", "visual studio code", "ide", "code editor", "محرر اكواد", "محرر الاكواد", "acode", "pycharm", "برنامج كتابه الاكواد"],"ar":"محررات الأكواد وبيئات التطوير (IDE): VS Code (مجاني وشائع على الحاسوب)، PyCharm لـPython، Android Studio لأندرويد، وعلى الهاتف تطبيق Acode الذي تستخدمينه. المحرر يلوّن الكود ويكمله ويكشف الأخطاء.","en":"Code editors and IDEs: VS Code (free and popular on desktop), PyCharm for Python, Android Studio for Android, and Acode on phones. They color, complete and check your code."},
{"k":["hello world", "اول برنامج", "برنامج مرحبا بالعالم", "first program", "اكتب برنامج بسيط"],"ar":"أول برنامج في Python:\nprint(\"Hello, World!\")\n\nفي JavaScript:\nconsole.log(\"Hello, World!\");\n\nفي HTML:\n<h1>Hello, World!</h1>\n\nشغّليها وغيّري النص لترين النتيجة.","en":"First program in Python:\nprint(\"Hello, World!\")\n\nIn JavaScript:\nconsole.log(\"Hello, World!\");\n\nIn HTML:\n<h1>Hello, World!</h1>\n\nRun them and change the text to see the result."},
{"k":["slow computer", "pc slow", "جهازي بطيء", "الجهاز بطيء", "الحاسوب بطيء", "اسرع جهازي", "تسريع الجهاز", "laptop slow", "speed up my computer", "speed up pc"],"ar":"لتسريع جهازك:\n• أعيدي التشغيل وأغلقي البرامج غير الضرورية.\n• عطّلي برامج بدء التشغيل.\n• وفّري مساحة 15% على الأقل في القرص.\n• استبدلي HDD بـSSD (أكبر تحسين).\n• زيدي الذاكرة RAM إن كانت قليلة.\n• حدّثي النظام وافحصي الفيروسات.","en":"To speed up your computer:\n• Restart and close unneeded programs.\n• Disable startup programs.\n• Keep at least 15% disk space free.\n• Replace an HDD with an SSD (biggest upgrade).\n• Add RAM if low.\n• Update the system and scan for malware."},
{"k":["file extension", "امتداد الملف", "امتدادات الملفات", "exe", "apk", "pdf", "docx", "mp4", "zip", "rar"],"ar":"امتدادات شائعة:\n• .exe و.msi: برامج ويندوز.\n• .apk: تطبيقات أندرويد.\n• .pdf و.docx و.xlsx: مستندات.\n• .jpg و.png: صور. .mp3 و.mp4: صوت وفيديو.\n• .zip و.rar: ملفات مضغوطة.\n• .py و.js و.html: أكواد.\nانتبهي: .exe و.apk و.js و.scr قد تكون خطرة إن جاءت من مصدر مجهول.","en":"Common extensions:\n• .exe and .msi: Windows programs.\n• .apk: Android apps.\n• .pdf, .docx, .xlsx: documents.\n• .jpg, .png: images. .mp3, .mp4: audio and video.\n• .zip, .rar: archives.\n• .py, .js, .html: code.\nCareful: .exe, .apk, .js and .scr can be dangerous from unknown sources."},
{"k":["keyboard shortcut", "اختصارات لوحه المفاتيح", "اختصارات", "ctrl c", "ctrl v", "نسخ ولصق"],"ar":"اختصارات مفيدة (ويندوز):\n• Ctrl+C نسخ، Ctrl+V لصق، Ctrl+X قص.\n• Ctrl+Z تراجع، Ctrl+Y إعادة.\n• Ctrl+S حفظ، Ctrl+A تحديد الكل، Ctrl+F بحث.\n• Alt+Tab التبديل بين البرامج.\n• Win+L قفل الجهاز. (على ماك استبدلي Ctrl بـCmd)","en":"Handy shortcuts (Windows):\n• Ctrl+C copy, Ctrl+V paste, Ctrl+X cut.\n• Ctrl+Z undo, Ctrl+Y redo.\n• Ctrl+S save, Ctrl+A select all, Ctrl+F find.\n• Alt+Tab switch programs.\n• Win+L lock the computer. (On Mac use Cmd instead of Ctrl)"},
{"k":["robot", "روبوت", "robotics", "الروبوتات", "arduino", "raspberry pi", "ارديونو", "iot", "انترنت الاشياء"],"ar":"الروبوتات آلات تُبرمج لتنفيذ مهام. للتعلم: Arduino (متحكم بسيط وفعّال للمشاريع الإلكترونية) وRaspberry Pi (حاسوب صغير يشغّل لينكس). وإنترنت الأشياء (IoT) هو ربط الأجهزة اليومية بالإنترنت، وله جانب أمني مهم لأن أجهزته قد تكون ضعيفة الحماية.","en":"Robots are machines programmed to do tasks. To learn: Arduino (a simple microcontroller for electronics projects) and Raspberry Pi (a small computer running Linux). The Internet of Things (IoT) connects everyday devices to the internet and has real security concerns since devices are often weakly protected."},
{k:['مرحبا','اهلا','السلام عليكم','hello','hi','hey','سلام'],ar:'أهلاً بك! اسألني عن الأمن السيبراني أو البرمجة أو الحاسوب.',en:'Hello! Ask me about cybersecurity, programming, or computers.'},
{k:['من انت','who are you','what are you','ما اسمك','ماذا تفعل'],ar:'أنا مساعد سيبراني ضمن مشروع توعوي. أجيب عن الأمن السيبراني والبرمجة والحاسوب فقط.',en:'I am a cybersecurity assistant inside an awareness project. I only answer cybersecurity, programming and computer questions.'},
{k:['تصيد','phishing','phish','رابط مشبوه','رساله مشبوهه','fake email','suspicious link'],ar:'التصيّد: رسالة أو موقع مزيف ينتحل جهة موثوقة ليسرق بياناتك.\n• لا تضغط روابط الرسائل المستعجلة.\n• افتح الموقع الرسمي بنفسك.\n• تحقق من عنوان المرسل والنطاق.\n• لا تعطِ رمز OTP لأي أحد.',en:'Phishing is a fake message or site that imitates a trusted party to steal your data.\n• Do not click links in urgent messages.\n• Open the official site yourself.\n• Check the sender and the domain.\n• Never share your OTP.'},
{k:['كلمه المرور','كلمات المرور','كلمه سر','باسورد','password','passwords','passphrase'],ar:'كلمة مرور قوية:\n• طويلة (14 حرفاً أو أكثر) أو عبارة من عدة كلمات.\n• فريدة لكل حساب.\n• استخدم مدير كلمات مرور.\n• لا تستخدم بيانات شخصية معروفة.',en:'A strong password is:\n• Long (14+ characters) or a multi-word passphrase.\n• Unique for each account.\n• Stored in a password manager.\n• Free of personal info.'},
{k:['مصادقه','2fa','otp','two factor','two-factor','mfa','ثنائيه','رمز التحقق'],ar:'المصادقة الثنائية تضيف خطوة تحقق ثانية (تطبيق مصادقة أو مفتاح أمان). فضّل التطبيقات على الرسائل النصية، وفعّلها على بريدك أولاً. ولا تشارك رمز التحقق مع أحد.',en:'Two-factor authentication adds a second check (authenticator app or security key). Prefer apps over SMS, enable it on your email first, and never share the code.'},
{k:['برمجيات خبيثه','فيروس','malware','virus','trojan','spyware','برامج التجسس','حصان طروادة','برنامج خبيث'],ar:'البرمجيات الخبيثة أنواع: فيروسات، أحصنة طروادة، برامج تجسس، فدية، إعلانات مزعجة.\nالوقاية: متاجر رسمية فقط، تحديثات منتظمة، مضاد فيروسات، وعدم فتح مرفقات مجهولة.',en:'Malware comes in many kinds: viruses, trojans, spyware, ransomware, adware.\nPrevention: official stores only, regular updates, antivirus, and never open unknown attachments.'},
{k:['فديه','ransomware','ransom'],ar:'برامج الفدية تشفّر ملفاتك وتطلب مالاً.\n• افصل الجهاز فوراً.\n• لا تدفع.\n• ابحث عن أدوات فك رسمية (No More Ransom).\n• الحل الأفضل: نسخ احتياطي منتظم.',en:'Ransomware encrypts your files and demands money.\n• Disconnect immediately.\n• Do not pay.\n• Look for official decryptors (No More Ransom).\n• Best defense: regular backups.'},
{k:['vpn','في بي ان','شبكه افتراضيه'],ar:'الـVPN يشفّر اتصالك ويخفي عنوانك عن الشبكة المحلية، وهو مفيد على الواي فاي العام. لكنه لا يحميك من التصيّد أو الملفات الخبيثة، فاختر خدمة موثوقة.',en:'A VPN encrypts your traffic and hides your address from the local network, useful on public Wi-Fi. It does not protect you from phishing or malware, so choose a trusted provider.'},
{k:['جدار الحمايه','فايروول','firewall'],ar:'جدار الحماية يراقب حركة الشبكة ويسمح أو يمنع الاتصالات وفق قواعد. فعّله على جهازك وراوترك.',en:'A firewall monitors network traffic and allows or blocks connections by rules. Keep it on for your device and router.'},
{k:['واي فاي','وايفاي','wifi','wi-fi','راوتر','router'],ar:'لتأمين الواي فاي:\n• غيّر كلمة مرور الراوتر الافتراضية.\n• استخدم تشفير WPA2 أو WPA3.\n• حدّث برنامج الراوتر.\n• عطّل WPS.\n• تجنب الشبكات العامة للأمور الحساسة.',en:'To secure Wi-Fi:\n• Change the default router password.\n• Use WPA2 or WPA3.\n• Update router firmware.\n• Disable WPS.\n• Avoid public networks for sensitive things.'},
{k:['تشفير','encryption','encrypt','hash','هاش','https','ssl','tls'],ar:'التشفير يحوّل البيانات إلى شكل غير مقروء إلا بمفتاح. HTTPS يشفّر الاتصال بين متصفحك والموقع. أما الـHash فبصمة أحادية الاتجاه تُستخدم لتخزين كلمات المرور والتحقق من سلامة الملفات.',en:'Encryption makes data unreadable without a key. HTTPS encrypts the link between your browser and a site. A hash is a one-way fingerprint used to store passwords and verify file integrity.'},
{k:['هندسه اجتماعيه','social engineering','انتحال'],ar:'الهندسة الاجتماعية خداع للإنسان بدل الجهاز: اتصال من "البنك" أو رسالة من "مديرك". الدفاع: لا تتصرف تحت الضغط، وتحقق عبر قناة رسمية.',en:'Social engineering tricks the person instead of the device: a call from your "bank" or a message from your "boss". Defense: do not act under pressure and verify through an official channel.'},
{k:['تم اختراق','اخترق حسابي','حسابي مخترق','حسابي اخترق','اختراق حسابي','hacked','got hacked','account hacked','was hacked','am hacked','compromised'],ar:'إذا اختُرق حسابك:\n1) غيّر كلمة المرور من جهاز آمن.\n2) سجّل الخروج من كل الجلسات.\n3) فعّل المصادقة الثنائية.\n4) غيّر كلمات المرور المتشابهة في حسابات أخرى.\n5) راجع البريد والتطبيقات المرتبطة.\n6) أبلغ الخدمة وأصدقاءك.\n(تجد الدليل الكامل في تبويب الطوارئ)',en:'If your account is hacked:\n1) Change the password from a safe device.\n2) Sign out of all sessions.\n3) Turn on 2FA.\n4) Change any reused passwords.\n5) Check email and linked apps.\n6) Report to the service and warn your contacts.\n(Full guide in the Emergency tab)'},
{k:['ملف مشبوه','مرفق مشبوه','suspicious file','suspicious attachment','virustotal','فحص ملف','scan a file','scan file'],ar:'مع الملف المشبوه:\n• لا تفتحه.\n• تحقق من الامتداد (exe، apk، scr، js خطر).\n• ارفعه لفحص متعدد المحركات مثل VirusTotal.\n• اسأل المرسل عبر قناة أخرى.\n• احذفه إن شككت.',en:'For a suspicious file:\n• Do not open it.\n• Check the extension (exe, apk, scr, js are risky).\n• Upload it to a multi-engine scanner such as VirusTotal.\n• Ask the sender via another channel.\n• Delete it if in doubt.'},
{k:['مضاد فيروسات','مكافح فيروسات','antivirus','anti-virus','defender'],ar:'مضاد الفيروسات يكتشف البرمجيات الخبيثة المعروفة وسلوكها المريب. يكفي عادةً مضاد واحد موثوق (مثل Microsoft Defender على ويندوز أو Play Protect على أندرويد) مع التحديثات، ولا يغني عن الحذر.',en:'Antivirus detects known malware and suspicious behavior. One trusted product is usually enough (such as Microsoft Defender on Windows or Play Protect on Android) plus updates, but it is no substitute for caution.'},
{k:['تحديث','تحديثات','update','updates','patch','ثغره','vulnerability','cve'],ar:'الثغرة خطأ في البرنامج قد يستغله مهاجم. الشركات تصدر تحديثات (Patches) لإصلاحها، لذلك التحديث المنتظم من أهم وسائل الدفاع.',en:'A vulnerability is a software flaw an attacker might exploit. Vendors ship patches to fix them, so regular updating is one of the best defenses.'},
{k:['نسخ احتياطي','backup','back up','نسخه احتياطيه'],ar:'قاعدة 3-2-1: ثلاث نسخ، على نوعين من الوسائط، واحدة منها خارج المكان (سحابة أو قرص خارجي). جرّب الاستعادة دورياً.',en:'The 3-2-1 rule: three copies, on two media types, one off-site (cloud or external drive). Test restoring from time to time.'},
{k:['ddos','حجب الخدمه','denial of service'],ar:'هجوم DDoS يُغرق خدمة بطلبات كثيرة من أجهزة مصابة فتتعطل. الدفاع: شبكات توزيع المحتوى (CDN)، تحديد معدل الطلبات، وخدمات الحماية.',en:'A DDoS attack floods a service with traffic from many infected machines until it fails. Defenses: CDNs, rate limiting and protection services.'},
{k:['sql injection','حقن sql','sqli','حقن'],ar:'حقن SQL يحدث عندما يُدمج إدخال المستخدم مباشرة في استعلام قاعدة البيانات. الحل: الاستعلامات المهيأة (Prepared Statements)، التحقق من المدخلات، وأقل صلاحيات ممكنة لحساب القاعدة.',en:'SQL injection happens when user input is merged straight into a database query. Fix: prepared statements, input validation and least-privilege database accounts.'},
{k:['xss','cross site scripting','csrf'],ar:'ثغرة XSS تسمح بتنفيذ سكربت في متصفح الضحية. الدفاع: ترميز المخرجات (Escaping)، سياسة CSP، وعدم عرض مدخلات المستخدم كما هي. أما CSRF فتُعالج بالرموز المضادة (CSRF tokens).',en:'XSS lets a script run in a victim’s browser. Defense: output escaping, a CSP, and never rendering raw user input. CSRF is handled with anti-CSRF tokens.'},
{k:['هاكر','hacker','ethical hacking','penetration','pentest','اختبار الاختراق','اختراق اخلاقي','white hat','ctf'],ar:'الهاكر الأخلاقي يختبر الأنظمة بإذن رسمي ليجد الثغرات ويصلحها. للبدء بشكل قانوني: تعلّم الشبكات ولينكس وأساسيات البرمجة، ثم تدرّب على منصات مرخّصة مثل TryHackMe وHack The Box ومسابقات CTF.',en:'An ethical hacker tests systems with written permission to find and fix flaws. To start legally: learn networking, Linux and programming basics, then practice on licensed platforms like TryHackMe, Hack The Box and CTF contests.'},
{k:['تعلم الامن السيبراني','تعلم سيبراني','مسار سيبراني','cybersecurity career','learn cybersecurity','start cybersecurity','ابدا في الامن السيبراني','ابدا الامن السيبراني'],ar:'مسار مقترح:\n1) أساسيات الحاسوب والشبكات (IP, DNS, TCP).\n2) لينكس وسطر الأوامر.\n3) بايثون أو لغة برمجة.\n4) أساسيات الأمن (CIA، التشفير، الثغرات).\n5) تدريب عملي على منصات مرخّصة وCTF.\nشهادات مبدئية: Security+ وغيرها.',en:'A suggested path:\n1) Computer and network basics (IP, DNS, TCP).\n2) Linux and the command line.\n3) Python or another language.\n4) Security basics (CIA triad, crypto, vulnerabilities).\n5) Hands-on practice on licensed platforms and CTFs.\nStarter certs: Security+ and similar.'},
{k:['امان الهاتف','امن الجوال','phone security','mobile security','android security','ايفون','اندرويد','android','iphone','apk'],ar:'لتأمين هاتفك:\n• قفل شاشة قوي.\n• تحديثات النظام والتطبيقات.\n• تطبيقات من المتجر الرسمي فقط وتجنب APK المجهولة.\n• راجع أذونات التطبيقات.\n• فعّل تحديد الجهاز المفقود.',en:'To secure your phone:\n• Strong screen lock.\n• System and app updates.\n• Official store apps only, avoid unknown APKs.\n• Review app permissions.\n• Enable find-my-device.'},
{k:['ip','عنوان ip','dns','tcp','port','منفذ','بروتوكول','protocol','شبكه','شبكات','network','networking'],ar:'أساسيات الشبكات:\n• IP: عنوان الجهاز في الشبكة.\n• DNS: يحوّل اسم الموقع إلى عنوان IP.\n• المنفذ (Port): بوابة لخدمة معينة على الجهاز (مثل 443 لـ HTTPS).\n• TCP: بروتوكول يضمن وصول البيانات بالترتيب.',en:'Network basics:\n• IP: a device’s address on a network.\n• DNS: turns a site name into an IP address.\n• Port: a doorway to a specific service (e.g. 443 for HTTPS).\n• TCP: a protocol that delivers data reliably and in order.'},
{k:['برمجه','تعلم البرمجه','learn programming','programming','coding','python','بايثون','javascript','جافاسكربت','html','css','java','c++','كود','code'],ar:'للبدء بالبرمجة: ابدأ بلغة واحدة (بايثون خيار سهل ومفيد جداً في الأمن). تعلّم المتغيرات والشروط والحلقات والدوال، ثم ابنِ مشاريع صغيرة. مصادر مجانية: freeCodeCamp وW3Schools ودروس يوتيوب. وإن عندك كود محدد فألصقه وسأشرحه لك.',en:'To start coding: pick one language (Python is easy and very useful in security). Learn variables, conditions, loops and functions, then build small projects. Free resources: freeCodeCamp, W3Schools and YouTube tutorials. If you have specific code, paste it and I will explain it.'},
{k:['لينكس','linux','ubuntu','kali','terminal','سطر الاوامر','bash'],ar:'لينكس نظام تشغيل مفتوح المصدر شائع في الخوادم والأمن. تعلّم أوامر مثل: ls (عرض)، cd (تنقل)، cat (قراءة)، grep (بحث)، chmod (صلاحيات). يمكنك التجربة مجاناً عبر Termux على أندرويد.',en:'Linux is an open-source OS common on servers and in security. Learn commands like ls (list), cd (move), cat (read), grep (search), chmod (permissions). You can practice free with Termux on Android.'},
{k:['قاعده بيانات','database','sql','mysql','data base'],ar:'قاعدة البيانات تخزّن البيانات بتنظيم. SQL لغة للاستعلام عنها (SELECT, INSERT, UPDATE, DELETE). أمنياً: استخدم استعلامات مهيأة وحصّن الصلاحيات.',en:'A database stores data in an organized way. SQL is the query language (SELECT, INSERT, UPDATE, DELETE). For security: use prepared statements and tight permissions.'},
{k:['ذكاء اصطناعي','ai','artificial intelligence','machine learning','تعلم الاله','chatgpt'],ar:'الذكاء الاصطناعي يفيد الأمن في كشف الشذوذ والتنبيهات، لكن المهاجمين يستخدمونه أيضاً في رسائل تصيّد مقنعة. لذلك التحقق من المصدر مهم حتى لو بدت الرسالة متقنة.',en:'AI helps security with anomaly detection and alerts, but attackers use it too for convincing phishing. So verify the source even if a message looks polished.'},
{k:['خصوصيه','privacy','بياناتك','اثر رقمي','digital footprint','cookies','كوكيز'],ar:'لحماية خصوصيتك: قلّل ما تنشره، راجع إعدادات الخصوصية، امنع أذونات غير ضرورية، واحذر من الكوكيز والتتبع. وفكّر قبل مشاركة أي صورة أو موقع.',en:'To protect your privacy: share less, review privacy settings, deny needless permissions, and watch cookies and trackers. Think before posting any photo or location.'},
{k:['نظام تشغيل','operating system','windows','ويندوز','macos','os'],ar:'نظام التشغيل يدير العتاد والبرامج (ويندوز، لينكس، macOS، أندرويد). أمنياً: حدّثه، واستخدم حساباً بصلاحيات عادية للاستخدام اليومي، وفعّل التشفير الكامل للقرص.',en:'The operating system manages hardware and software (Windows, Linux, macOS, Android). For security: keep it updated, use a standard account day to day, and enable full-disk encryption.'},
{"k":["لغات البرمجه", "لغه برمجه", "لغات برمجه", "programming languages", "programming language", "which language", "اي لغه"],"ar":"أشهر لغات البرمجة:\n• Python: سهلة وممتازة للمبتدئين وللأمن والأتمتة.\n• JavaScript: لغة المواقع والتطبيقات التفاعلية.\n• Java وKotlin: تطبيقات أندرويد والأنظمة الكبيرة.\n• C وC++: برمجة الأنظمة والأداء العالي.\n• C#: ألعاب Unity وتطبيقات ويندوز.\n• SQL: للتعامل مع قواعد البيانات.\n• Bash وPowerShell: سكربتات إدارة الأنظمة.\n(وHTML وCSS لغتا هيكلة وتنسيق الصفحات وليستا لغتي برمجة بالمعنى الكامل)\nاكتبي \"بالتفصيل\" لأرشدك إلى اللغة المناسبة لهدفك.","en":"Popular programming languages:\n• Python: easy, great for beginners, security and automation.\n• JavaScript: the language of websites and interactive apps.\n• Java and Kotlin: Android apps and large systems.\n• C and C++: systems programming and high performance.\n• C#: Unity games and Windows apps.\n• SQL: working with databases.\n• Bash and PowerShell: system administration scripts.\n(HTML and CSS structure and style pages and are not full programming languages)\nType \"in detail\" and I will help you pick one for your goal."}
];
var DET={"لغات البرمجه": {"ar": "كيف تختارين لغة؟ حسب هدفك:\n• الأمن السيبراني والأتمتة: Python ثم Bash.\n• مواقع الويب: HTML وCSS وJavaScript.\n• تطبيقات أندرويد: Kotlin أو Java.\n• فهم الذاكرة والثغرات منخفضة المستوى: C وC++.\n• قواعد البيانات: SQL.\nنصيحة: ابدئي بلغة واحدة فقط وأتقنيها بمشاريع صغيرة، فالمفاهيم (المتغيرات، الشروط، الحلقات، الدوال) تنتقل بين اللغات.", "en": "How to choose by goal:\n• Cybersecurity and automation: Python then Bash.\n• Websites: HTML, CSS and JavaScript.\n• Android apps: Kotlin or Java.\n• Memory and low-level vulnerabilities: C and C++.\n• Databases: SQL.\nTip: start with one language and master it through small projects. The concepts (variables, conditions, loops, functions) carry across languages."}, "تصيد": {"ar": "أنواع التصيّد:\n• البريد التصيّدي: رسائل جماعية تنتحل جهة معروفة.\n• التصيّد الموجّه (Spear): رسالة مخصصة لشخص معين بمعلومات عنه.\n• الرسائل النصية (Smishing) والمكالمات (Vishing).\n• المواقع المزيفة: تشبه الموقع الأصلي مع تغيير بسيط في العنوان.\nكيف تكشفينه: افحصي عنوان المرسل والنطاق، لا تضغطي على الروابط، وتحققي بقناة رسمية. وإن وقعتِ فيه: غيّري كلمة المرور فوراً وفعّلي المصادقة الثنائية (تجدين الدليل في تبويب الطوارئ).", "en": "Types of phishing:\n• Email phishing: mass messages impersonating a known party.\n• Spear phishing: tailored to one person using facts about them.\n• Smishing (SMS) and vishing (calls).\n• Fake sites: look like the real one with a small address change.\nHow to spot it: check the sender and domain, avoid links, verify through an official channel. If you fell for it: change the password at once and enable 2FA (see the Emergency tab)."}, "كلمه المرور": {"ar": "أفكار متقدمة لكلمات المرور:\n• العبارة الطويلة (4 كلمات عشوائية أو أكثر) أقوى وأسهل حفظاً من رموز معقدة قصيرة.\n• لا تعيدي استخدام كلمة المرور أبداً بين الحسابات.\n• مدير كلمات المرور يولّد ويحفظ كلمات فريدة، ويكفيك حفظ كلمة رئيسية واحدة قوية.\n• تحققي من تسريب بريدك عبر خدمة Have I Been Pwned.\n• غيّريها فوراً عند أي تسريب أو شك.", "en": "Advanced password tips:\n• A long passphrase (4+ random words) is stronger and easier to remember than short complex symbols.\n• Never reuse a password across accounts.\n• A password manager generates and stores unique ones, so you only memorize one strong master password.\n• Check whether your email leaked using Have I Been Pwned.\n• Change it right away after any leak or doubt."}, "مصادقه": {"ar": "أنواع المصادقة الثنائية من الأضعف إلى الأقوى:\n• رمز عبر SMS: أفضل من لا شيء لكنه قابل للاعتراض أو لسرقة الشريحة.\n• تطبيق مصادقة (Authenticator): رمز يتغير كل 30 ثانية.\n• مفتاح أمان فعلي (FIDO2/Passkey): الأقوى ضد التصيّد.\nاحفظي رموز الاسترداد خارج هاتفك، وفعّليها أولاً على بريدك لأنه مفتاح بقية حساباتك.", "en": "Two-factor methods from weakest to strongest:\n• SMS code: better than nothing but can be intercepted or SIM-swapped.\n• Authenticator app: a code that changes every 30 seconds.\n• Hardware key or passkey (FIDO2): strongest against phishing.\nStore recovery codes away from your phone, and enable it first on your email since it unlocks your other accounts."}, "برمجيات خبيثه": {"ar": "أنواع البرمجيات الخبيثة:\n• الفيروس: يلتصق بملفات وينتشر عند تشغيلها.\n• الدودة (Worm): تنتشر بنفسها عبر الشبكات.\n• حصان طروادة: يبدو تطبيقاً مفيداً ويخفي وظيفة ضارة.\n• برامج التجسس وتسجيل المفاتيح: تسرق ما تكتبينه.\n• الفدية: تشفّر الملفات.\n• الإعلانات المزعجة (Adware).\nعلامات الإصابة: بطء مفاجئ، إعلانات غريبة، تطبيقات لا تعرفينها، استهلاك بطارية أو بيانات غير مبرر.", "en": "Types of malware:\n• Virus: attaches to files and spreads when they run.\n• Worm: spreads by itself across networks.\n• Trojan: looks like a useful app but hides harmful behavior.\n• Spyware and keyloggers: steal what you type.\n• Ransomware: encrypts files.\n• Adware.\nInfection signs: sudden slowness, odd ads, unknown apps, unexplained battery or data drain."}, "فديه": {"ar": "كيف تحمين نفسك من الفدية:\n• نسخ احتياطي بقاعدة 3-2-1 مع نسخة غير متصلة بالجهاز.\n• تحديث النظام والتطبيقات.\n• عدم فتح مرفقات أو ماكروات الوثائق المجهولة.\n• صلاحيات حساب عادي بدل مدير في الاستخدام اليومي.\nعند الإصابة: افصلي الجهاز، لا تدفعي، وابحثي عن أدوات فك رسمية في مشروع No More Ransom.", "en": "How to protect yourself from ransomware:\n• 3-2-1 backups with one copy kept offline.\n• Keep the system and apps updated.\n• Do not open unknown attachments or document macros.\n• Use a standard account instead of admin day to day.\nIf infected: disconnect, do not pay, and look for official decryptors at the No More Ransom project."}, "ip": {"ar": "تفصيل أكثر عن الشبكات:\n• عنوان IP: عام (تراه المواقع) وخاص داخل شبكتك.\n• DNS: دليل الهاتف الذي يترجم الاسم إلى IP، وقد يُستغل في التوجيه المزيف.\n• المنافذ: 80 لـHTTP و443 لـHTTPS و22 لـSSH.\n• TCP يضمن وصول البيانات بترتيب، وUDP أسرع بدون ضمان (للبث والألعاب).\n• الراوتر يوجّه الحزم، وجدار الحماية يقرر ما يُسمح له بالمرور.", "en": "More on networking:\n• IP address: public (sites see it) and private inside your network.\n• DNS: the phone book translating names to IPs, and a target for spoofing.\n• Ports: 80 for HTTP, 443 for HTTPS, 22 for SSH.\n• TCP guarantees ordered delivery, UDP is faster with no guarantee (streaming, games).\n• The router forwards packets, and the firewall decides what may pass."}, "برمجه": {"ar": "خطة بسيطة لتعلم البرمجة:\n1) اختاري Python.\n2) تعلمي: المتغيرات، الشروط (if)، الحلقات (for/while)، الدوال، القوائم.\n3) ابني مشاريع صغيرة: حاسبة، لعبة تخمين، مولّد كلمات مرور.\n4) تعلمي قراءة رسائل الأخطاء وكيف تبحثين عن حلها.\n5) استخدمي Git وGitHub لحفظ مشاريعك.\nالمداومة 30 دقيقة يومياً أفضل من يوم طويل مرة في الأسبوع.", "en": "A simple plan to learn programming:\n1) Pick Python.\n2) Learn variables, conditions (if), loops (for/while), functions, lists.\n3) Build small projects: a calculator, a guessing game, a password generator.\n4) Learn to read error messages and search for fixes.\n5) Use Git and GitHub to save your projects.\n30 minutes daily beats one long day a week."}, "ذكاء اصطناعي": {"ar": "الذكاء الاصطناعي والأمن السيبراني:\n• للدفاع: كشف السلوك الشاذ، وتصنيف الرسائل المزعجة والتصيّد، وتحليل السجلات بسرعة.\n• للهجوم: رسائل تصيّد متقنة، وتقليد الأصوات والوجوه (Deepfake).\n• مخاطر على أنظمة الذكاء نفسها: حقن التعليمات (Prompt Injection) وتسريب البيانات.\nنصائح: لا تشاركي بياناتك الحساسة مع أي أداة، وتحققي من المصدر حتى لو بدا الصوت أو الفيديو حقيقياً.", "en": "AI and cybersecurity:\n• For defense: anomaly detection, spam and phishing classification, fast log analysis.\n• For attack: polished phishing, voice and face cloning (deepfakes).\n• Risks to AI systems themselves: prompt injection and data leakage.\nTips: do not share sensitive data with any tool, and verify the source even when audio or video looks real."}, "vpn": {"ar": "متى يفيد الـVPN ومتى لا؟\n• يفيد: على الواي فاي العام، وإخفاء نشاطك عن الشبكة المحلية.\n• لا يفيد: ضد التصيّد، أو الملفات الخبيثة، أو تسجيل الدخول لحساب مخترق.\n• الـVPN المجاني قد يبيع بياناتك، فاختاري خدمة موثوقة ذات سياسة عدم تسجيل واضحة.", "en": "When a VPN helps and when it does not:\n• Helps: on public Wi-Fi and for hiding activity from the local network.\n• Does not help: against phishing, malicious files, or logging into a compromised account.\n• Free VPNs may sell your data, so choose a trusted provider with a clear no-logs policy."}, "لينكس": {"ar": "أوامر لينكس الأساسية:\n• pwd: أين أنا.\n• ls: عرض الملفات.\n• cd: التنقل بين المجلدات.\n• mkdir وrm: إنشاء وحذف.\n• cat وless: قراءة الملفات.\n• grep: البحث داخل النصوص.\n• chmod: تغيير الصلاحيات.\nجرّبيها مجاناً على الهاتف عبر تطبيق Termux.", "en": "Basic Linux commands:\n• pwd: where am I.\n• ls: list files.\n• cd: change folder.\n• mkdir and rm: create and delete.\n• cat and less: read files.\n• grep: search inside text.\n• chmod: change permissions.\nTry them free on your phone with the Termux app."}};

/(اكتب|اصنع|اعمل|انشئ|برمج|ابني).{0,25}(فيروس|برنامج خبيث|برمجيه خبيثه|فديه|كيلوجر|برنامج تجسس|استغلال|صفحه تصيد|موقع تصيد)/
];
var SAFE=/(scanner|detect|remove|protect|against|defen|prevent|اكتشاف|كشف|ازاله|حمايه|فحص|منع|دفاع)/;

function norm(s){var x=String(s).toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();return x.replace(/(^| )ال(?=[^ ])/g,'$1')}
function words(t){return t.split(/[^a-z0-9+#.]+/).filter(Boolean)}
function hit(k,t,w){k=norm(k);if(!/^[a-z0-9 .+#-]+$/.test(k)&&k.length<=3)return (' '+t+' ').indexOf(' '+k+' ')>-1;if(/^[a-z0-9 .+#-]+$/.test(k)){if(k.indexOf(' ')>-1||k.indexOf('-')>-1)return t.indexOf(k)>-1;return w.some(function(x){return x===k||(k.length>=5&&x.indexOf(k)===0)})}return t.indexOf(k)>-1}

function isHarm(t){if(SAFE.test(t))return false;return HARM.some(function(r){return r.test(t)})}

var CMPRE=/(فرق|مقارنه|difference|versus|compare| vs |^vs )/;
var FOLLOWRE=/(^| )(بالتفصيل|تفصيل|تفاصيل|مزيد|اكثر|اكتر|وضح|اوضح|فصل|in detail|detail|details|more|elaborate|expand|deeper)( |$)/;

('ما ماذا ماهو ماهي هو هي هل كيف لماذا متى اين من في على عن الي او و ان انا انت يمكنك يمكن ممكن تشرح اشرح شرح وضح اوضح فصل بالتفصيل تفاصيل تفصيل مزيد اكثر اكتر عنها عنه عنهم ذلك هذا هذه تلك لو سمحت رجاء فضلا لي لنا بين فرق تعني معني يعني بشكل اعطني قل اخبرني احتاج اريد اعرف ' +
 'what is are the an how why does do did can could you me my about of to in for and or it this that explain more detail details please tell give show between difference mean means meaning with on i a be was were should would which who when where').split(' ').forEach(function(x){if(x)STOPW[x]=1});
function toks(t){return t.split(/[^a-z0-9؀-ۿ+#]+/).filter(Boolean)}
function contentWords(t){return toks(t).filter(function(x){return !STOPW[x]&&(x.length>=3||(/^[a-z0-9+#]+$/.test(x)&&x.length>=2))})}
function isFollow(t){return FOLLOWRE.test(t)&&contentWords(t).length<=1}
var IDX=null;
function buildIdx(){IDX=KB.map(function(e){var set={};toks(norm((e.ar||'')+' '+(e.en||'')+' '+e.k.join(' '))).forEach(function(x){if(x.length>=2)set[x]=1});return {e:e,w:Object.keys(set)}})}
function wordIn(w,ws){for(var i=0;i<ws.length;i++){var v=ws[i];if(v===w)return true;if(v.length>=4&&w.length>=4&&(v.indexOf(w)===0||w.indexOf(v)===0))return true}return false}
function related(t){
 if(!IDX)buildIdx();
 var q=contentWords(t);var per=q.map(function(w){return IDX.map(function(r){return wordIn(w,r.w)})});
 var rare=q.map(function(w,i){var n=per[i].filter(Boolean).length;return n>0&&n<=8});
 var out=IDX.map(function(r,j){var s=0;q.forEach(function(w,i){if(rare[i]&&per[i][j])s++});return {e:r.e,s:s}}).filter(function(x){return x.s>0});
 out.sort(function(a,b){return b.s-a.s});return {q:q,list:out};
}
function title(e){var want=S.lang==='ar'?/[؀-ۿ]/:/^[a-z]/;return e.k.filter(function(k){return want.test(k)})[0]||e.k[0]}
function reply(text){
 var t=norm(text);var w=words(t);
 if(isHarm(t))return u('harm');
 var best=null,bs=0;
 KB.forEach(function(e){var n=0;e.k.forEach(function(k){if(hit(k,t,w))n+=norm(k).length});if(n>bs){bs=n;best=e}});
 if(best){S.last=best;if(isFollow(t)&&best.d)return best.d[S.lang];
  if(CMPRE.test(t)){var sc=KB.map(function(e){var n=0;e.k.forEach(function(k){if(hit(k,t,w))n+=norm(k).length});return {e:e,n:n}}).filter(function(x){return x.n>0&&x.e!==best}).sort(function(a,b){return b.n-a.n});
   if(sc.length&&sc[0].n>=bs*0.5)return best[S.lang]+'\n\n— — —\n\n'+sc[0].e[S.lang]}
  return best[S.lang]}
 if(isFollow(t)){if(S.last)return S.last.d?S.last.d[S.lang]:S.last[S.lang]+'\n\n'+u('moreHint');return u('askFirst')}
 var rel=related(t);
 if(rel.list.length&&rel.list[0].s>=2){S.last=rel.list[0].e;return u('closest')+'\n\n'+rel.list[0].e[S.lang]}
 var inDom=EXTRA.some(function(k){return hit(k,t,w)});
 if(!inDom)return u('off');
 var kw=rel.q.slice(0,4).join(' ')||String(text).trim().slice(0,40);
 var msg=u('noAns').replace('%s',kw);
 if(rel.list.length){msg+='\n'+u('mean')+rel.list.slice(0,3).map(function(x){return title(x.e)}).join(S.lang==='ar'?'، ':', ')+(S.lang==='ar'?'؟':'?')}
 else msg+='\n'+u('tryAsk');
 return msg;
}

 if(z.sel!==null){h+='<div class="exp"><b>'+(z.sel===q.a?u('correct'):u('wrong'))+'</b><br>'+esc(tx(q.e))+'</div><button class="btn" onclick="nextQ()">'+(z.i===z.qs.length-1?u('finish'):u('next'))+'</button>'}
 return h+'</div>';
}
function pickQuiz(){var idx=QZ.map(function(_,i){return i});var pool=idx.filter(function(i){return S.seen.indexOf(i)<0});if(pool.length<10){S.seen=[];pool=idx.slice()}shuffle(pool);var pick=pool.slice(0,10);S.seen=S.seen.concat(pick);return pick.map(function(i){var q=QZ[i];var n=q.o.ar.length;var ord=shuffle(Array.from({length:n},function(_,k){return k}));return {q:q.q,e:q.e,a:ord.indexOf(q.a),o:{ar:ord.map(function(k){return q.o.ar[k]}),en:ord.map(function(k){return q.o.en[k]})}}})}
function startQuiz(){S.quiz={i:0,score:0,sel:null,done:false,qs:pickQuiz()};render()}
function ansQ(j){var z=S.quiz;if(z.sel!==null)return;z.sel=j;if(j===z.qs[z.i].a)z.score++;render()}
function nextQ(){var z=S.quiz;z.i++;z.sel=null;if(z.i>=z.qs.length)z.done=true;render()}
function vPhish(){
 var z=S.phish;
 if(!z)return '<div class="card"><p>'+u('spotD')+'</p><button class="btn" onclick="startPh()">'+u('start')+'</button></div>';
 if(z.done){return '<div class="card"><div class="score">'+z.score+' / '+z.items.length+'</div><p style="text-align:center;font-size:24px;margin:0;color:var(--acc)"><b>'+Math.round(z.score/z.items.length*100)+'%</b></p><p style="text-align:center;font-size:18px"><b>'+level(z.score/z.items.length)+'</b></p><button class="btn" onclick="startPh()">'+u('again')+'</button></div>'}
 var it=z.items[z.i];
 var h='<div class="card"><small>'+u('q')+' '+(z.i+1)+' '+u('of')+' '+z.items.length+'</small><div class="bar"><i style="width:'+(z.i/z.items.length*100)+'%"></i></div><div class="sms">'+esc(it.m)+'</div>';
 if(z.sel===null){h+='<div class="row"><button class="btn sec" onclick="ansP(1)">'+u('phishB')+'</button><button class="btn sec" onclick="ansP(0)">'+u('safeB')+'</button></div>'}
 else{h+='<div class="exp"><b>'+((z.sel===it.p)?u('correct'):u('wrong'))+'</b><br>'+(it.p?u('phishB'):u('safeB'))+' — '+esc(tx(it.e))+'</div><button class="btn" onclick="nextP()">'+(z.i===z.items.length-1?u('finish'):u('next'))+'</button>'}
 return h+'</div>';
}
function startPh(){S.phish={i:0,score:0,sel:null,done:false,items:shuffle(PH.slice()).slice(0,8)};render()}
function ansP(v){var z=S.phish;if(z.sel!==null)return;z.sel=v;if(v===z.items[z.i].p)z.score++;render()}
function nextP(){var z=S.phish;z.i++;z.sel=null;if(z.i>=z.items.length)z.done=true;render()}

function vChat(){
 if(!S.msgs.length)S.msgs.push({f:'bot',t:u('chatHello'),g:1});
 var sugg=S.lang==='ar'?['ما هو التصيّد؟','تم اختراق حسابي','كيف أفحص ملفاً مشبوهاً؟','كيف أبدأ البرمجة؟']:['What is phishing?','My account was hacked','How do I check a suspicious file?','How do I start programming?'];
 return '<h2>'+u('hChat')+'</h2><div class="chips">'+sugg.map(function(s,i){return '<button class="chip" data-s="'+esc(s)+'" onclick="sendText(this.getAttribute(\'data-s\'))">'+esc(s)+'</button>'}).join('')+'</div>'+
 '<div id="msgs">'+S.msgs.map(function(m){return '<div class="msg '+(m.f==='me'?'me':'bot')+'">'+esc(m.t)+'</div>'}).join('')+'</div>'+
 '<div class="foot" id="ainote" style="margin:0 0 8px"></div>'+'<div class="in"><input id="inp" type="text" autocomplete="off" autocapitalize="off" enterkeyhint="send" placeholder="'+esc(u('ph'))+'" onkeydown="inpKey(event)" onkeyup="inpKey(event)"><button class="btn" type="button" onclick="sendMsg()">'+u('send')+'</button></div>';
}
var AI_URL='https://cyvora-ai.nfs65939.workers.dev';
var SAMPLE;
function getSample(){
 if(SAMPLE!==undefined)return Promise.resolve(SAMPLE);
 if(!(window.claude&&window.claude.use))return Promise.resolve(SAMPLE=null);
 return window.claude.use('sample').then(function(s){SAMPLE=s||null;return SAMPLE}).catch(function(){SAMPLE=null;return null});
}
function updNote(){
 if(!AI_URL&&!(window.claude&&window.claude.use))return;
 getSample().then(function(sm){if((sm&&!S.noSample)||AI_URL){var n=$('#ainote');if(n)n.textContent=u('aiNote')}});
}
function addMsg(f,t){var m={f:f,t:t};S.msgs.push(m);var box=$('#msgs');var d=null;if(box){d=document.createElement('div');d.className='msg '+(f==='me'?'me':'bot');d.textContent=t;box.appendChild(d);window.scrollTo(0,document.body.scrollHeight)}return {m:m,d:d}}
function setBot(hd,t){hd.m.t=t;if(hd.d)hd.d.textContent=t;window.scrollTo(0,document.body.scrollHeight)}
function rules(){
 return 'You are the assistant inside CYVORA, a cybersecurity awareness project made by a student. '+
 'Answer ONLY questions about computers, hardware, software, operating systems, networking, the internet, programming and programming languages, artificial intelligence, and cybersecurity. '+
 'If the question is about anything else, reply with exactly this sentence and nothing more: '+u('off')+' '+
 'Never help hack or spy on other people, write malware, ransomware, keyloggers, exploits or phishing pages, or bypass security. For such requests reply with exactly: '+u('harm')+' '+
 'Defensive and educational security explanations are fine. '+
 'Reply in '+(S.lang==='ar'?'Arabic':'English')+', clearly and briefly (under 180 words), for students. Use short paragraphs or simple bullet points, no tables and no headings. If you are not sure, say so. The conversation follows.';
}
function askClaude(sm,text,hist,hd){
 var turns=[{role:'user',content:rules()}];
 hist.forEach(function(m){turns.push({role:m.role==='model'?'assistant':'user',content:m.text})});
 turns.push({role:'user',content:text});
 return sm(turns,{modelTier:'quick',cache:false,onText:function(x){setBot(hd,x.text)}}).then(function(r){setBot(hd,r.text)});
}
function askAI(text,hist){
 var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
 var to=setTimeout(function(){if(ctl)ctl.abort()},20000);
 return fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,lang:S.lang,history:hist}),signal:ctl?ctl.signal:undefined}).then(function(r){clearTimeout(to);if(!r.ok)throw new Error('http');return r.json()}).then(function(j){if(!j||!j.reply)throw new Error('empty');return String(j.reply)});
}
var HARDFAIL={not_granted:1,sampling_disabled:1,not_declared:1,capability_disabled:1,capability_removed:1,session_expired:1};
function sendText(t){
 t=String(t||'').trim();if(!t||S.busy)return;
 if(t.length>500)t=t.slice(0,500);
 var hist=S.msgs.filter(function(m){return !m.g&&m.t!=='…'}).slice(-6).map(function(m){return {role:m.f==='me'?'user':'model',text:m.t}});
 addMsg('me',t);
 if(isHarm(norm(t))){setTimeout(function(){addMsg('bot',u('harm'))},300);return}
 if(!AI_URL&&!(window.claude&&window.claude.use)){setTimeout(function(){addMsg('bot',reply(t))},350);return}
 S.busy=true;var hd=addMsg('bot','…');
 getSample().then(function(sm){
  if(sm&&!S.noSample)return askClaude(sm,t,hist,hd);
  if(AI_URL)return askAI(t,hist).then(function(r){setBot(hd,r)});
  throw {code:'local'};
 }).catch(function(e){
  if(e&&HARDFAIL[e.code])S.noSample=true;
  if(e&&e.text&&e.code!=='refused'&&e.code!=='cancelled'){setBot(hd,e.text);return}
  if(AI_URL&&e&&e.code&&e.code!=='local'&&!S.triedAI){S.triedAI=1;return askAI(t,hist).then(function(r){setBot(hd,r)}).catch(function(){setBot(hd,reply(t))})}
  setBot(hd,reply(t));
 }).then(function(){S.busy=false});
}
function sendMsg(){var i=$('#inp');if(!i)return;var t=i.value;if(!String(t).trim())return;i.value='';sendText(t);i.focus()}
function inpKey(e){if(e.key==='Enter'||e.keyCode===13){if(e.preventDefault)e.preventDefault();sendMsg()}}

function render(){
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
 document.title=u('app');$('#ttl').innerHTML='<span class="lg1">⬢</span><span class="logo">CYVORA</span>';$('#lg').textContent=u('langbtn');
 var v=S.view;var h=v==='home'?vHome():v==='learn'?vLearn():v==='emg'?vEmg():v==='play'?vPlay():vChat();
 $('#app').innerHTML=h;if(v==='chat')updNote();
 $('#nav').innerHTML=[['home','🏠'],['learn','📚'],['emg','🚨'],['play','🎮'],['chat','🤖']].map(function(a){return '<button class="'+(v===a[0]?'on':'')+'" onclick="go(\''+a[0]+'\')"><span>'+a[1]+'</span>'+u(a[0])+'</button>'}).join('');
}
render();

if(seen){e.remove();return}
$('#spi').textContent=u('sigT')+' '+u('sigN');$('#sps').textContent=u('sigR');
setTimeout(function(){e.classList.add('hide');setTimeout(function(){e.remove()},700)},2600);
try{sessionStorage.setItem('cs_spl','1')}catch(x){}})();
</script>
